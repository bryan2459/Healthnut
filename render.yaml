services:
  - type: web
    name: healthnut
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PUBLIC_APP_URL
        value: https://healthnut-ozwo.onrender.com
      - key: ADMIN_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: BOOKING_NOTIFY_EMAIL
        sync: false
      - key: EMAIL_DELIVERY
        value: enabled
